services:
  # ==========================================
  # 1. DiroAdmin Backend: .NET 10 API
  # ==========================================
  backend:
    build:
      context: ./backend/DiroAdmin.Api
      dockerfile: Dockerfile
    container_name: diroadmin-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5020
      - DB_PATH=/app/data/diroadmin.db
    ports:
      - "5020:5020"
    volumes:
      - diroadmin-data:/app/data
    networks:
      - diroadmin-network

  # ==========================================
  # 2. DiroAdmin Frontend: Vue 3 + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diroadmin-frontend
    restart: unless-stopped
    ports:
      - "8080:80"       # Cổng truy cập Web DiroAdmin: http://localhost:8080
    depends_on:
      - backend
    networks:
      - diroadmin-network

networks:
  diroadmin-network:
    driver: bridge

volumes:
  diroadmin-data:
    driver: local
